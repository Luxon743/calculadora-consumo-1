<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Pulse - Calculadora Futurista</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050509',
                        electricBlue: '#00f2fe',
                        neonPurple: '#4facfe',
                    },
                    boxShadow: {
                        'neon-blue': '0 0 15px rgba(0, 242, 254, 0.5)',
                        'neon-card': '0 0 25px rgba(79, 172, 254, 0.2)',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="w-full max-w-6xl flex gap-6">
        <div class="w-1/2 bg-white p-6 rounded-2xl shadow">

        <h1 class="text-2xl font-bold text-gray-700 mb-6">
            Registro de Carga
        </h1>

        <form id="calc-form" class="flex flex-col gap-4">

            <div>
            <label class="text-sm text-gray-600">KM inicial</label>
            <input id="km-inicio" type="number" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
            <label class="text-sm text-gray-600">KM actual</label>
            <input id="km-fin" type="number" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
            <label class="text-sm text-gray-600">Litros</label>
            <input id="litros" type="number" step="0.01" class="w-full border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button type="submit" class="bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
            Agregar Carga
            </button>
        </form>
        </div>

        <div class="w-1/2 bg-white p-6 rounded-2xl shadow flex flex-col">

            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                Historial de Cargas
            </h2>
            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600">
                            <th class="p-2">KM</th>
                            <th class="p-2">Litros</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cargas"></tbody>
                </table>
            </div>
            <div class="mt-4 flex gap-2">
                <button id="btn-calcular" type="button" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
                    Calcular Viaje
                </button>
                <button id="btn-reset" type="button" class="flex-1 bg-gray-300 py-2 rounded-lg hover:bg-gray-400 transition">
                    Limpiar
                </button>
            </div>
        </div>
    </div>
</body>
</html>
