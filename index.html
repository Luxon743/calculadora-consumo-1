<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Consumo</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <form id="calc-form">
            <input type="number" class="input-field" id="km-inicio" placeholder="Km Iniciales" required>
            <input type="number" class="input-field" id="km-fin" placeholder="Km Finales" required>
            <input type="number" class="input-field" id="litros" placeholder="Litros cargados" required>
            <button type="submit" id="btn">Calcular</button>
        </form>
        <div id="resultado"></div>
    </div>


</body>

</html>
